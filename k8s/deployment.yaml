apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: fcg
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
      - name: payments-api
        image: payments-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: payments-config
        env:
        - name: RabbitMQ__Username
          valueFrom:
            secretKeyRef:
              name: payments-secrets
              key: rabbitmq-username
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: payments-secrets
              key: rabbitmq-password
        - name: DOTNET_ENVIRONMENT
          value: "Production"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep FCG.Payments.Worker"
          initialDelaySeconds: 15
          periodSeconds: 20
      restartPolicy: Always
